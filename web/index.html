<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dharmeme</title>
  <meta name="description" content="A Buddhist meme generator. Dharma + meme.">
  <link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>dharmeme</h1>
    <p class="tagline">All memes are impermanent.</p>
  </header>

  <main>
    <section class="stage">
      <canvas id="meme" aria-label="Meme"></canvas>
      <div class="actions">
        <button id="random" type="button">Another one</button>
        <button id="download" type="button" class="secondary">Download</button>
        <span id="votes" class="votes" hidden>
          <button id="vote-up" type="button" class="secondary" aria-label="Thumbs up">👍</button>
          <button id="vote-down" type="button" class="secondary" aria-label="Thumbs down">👎</button>
          <button id="vote-report" type="button" class="link">Report</button>
        </span>
      </div>
      <p id="status" class="status" role="status"></p>
      <h2 class="themes-title">Or get a fresh one on a theme</h2>
      <div id="themes" class="themes"></div>
    </section>

    <details id="editor" class="editor">
      <summary>Write your own</summary>
      <label for="template">Template</label>
      <select id="template"></select>
      <p id="format" class="format"></p>
      <div id="slots"></div>
      <label class="debug"><input id="debug" type="checkbox"> Show text boxes</label>
    </details>
  </main>

  <footer>
    <a href="https://guoxiangng.github.io/projects/dharmeme.html">About this project</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
