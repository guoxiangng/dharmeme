<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dharmeme</title>
  <meta name="description" content="A Buddhist meme generator. Dharma + meme.">
  <link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>dharmeme</h1>
    <p class="tagline">All memes are impermanent.</p>
  </header>

  <main>
    <section class="stage">
      <canvas id="meme" aria-label="Meme preview"></canvas>
      <div class="actions">
        <button id="download" type="button">Download</button>
        <label class="debug"><input id="debug" type="checkbox"> Show text boxes</label>
      </div>
    </section>

    <section class="editor">
      <label for="template">Template</label>
      <select id="template"></select>
      <p id="format" class="format"></p>
      <div id="slots"></div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
