# Themes a visitor can ask for a meme about (SPEC.md §5). The public never types a topic:
# they pick one of these. `label` is what the button says; `brief` is for the model only.
#
# The list spans the traditions: the early teachings shared by all schools, and Mahayana,
# Chan/Zen and Pure Land practice. Jokes are always on the practitioner, never on the
# teaching or on the Buddhas and bodhisattvas named here.

themes:
  # --- shared foundations ---
  - id: impermanence
    label: Impermanence
    brief: >-
      Anicca: everything changes and ends. The practitioner knows this in theory and is
      still surprised or upset when a particular thing changes.
  - id: dukkha
    label: Dukkha
    brief: >-
      The unsatisfactoriness of ordinary life, from big sorrows to small daily
      irritations, and how the practitioner makes it worse by resisting it.
  - id: non-self
    label: Non-self
    brief: >-
      Anatta: there is no fixed, separate self. The practitioner accepts this on the
      cushion and defends their ego fiercely five minutes later.
  - id: attachment
    label: Attachment
    brief: >-
      Craving and clinging (tanha, upadana) to things, people, opinions, comfort or
      one's phone, and the suffering that follows.
  - id: letting-go
    label: Letting go
    brief: >-
      Releasing what one clings to. Easy to say, and the practitioner picks the thing
      straight back up.
  - id: middle-way
    label: The middle way
    brief: >-
      Avoiding the extremes of indulgence and harsh self-denial. The practitioner swings
      between both instead.
  - id: karma
    label: Karma
    brief: >-
      Actions have results. The practitioner is surprised by the entirely predictable
      results of their own actions.
  - id: right-speech
    label: Right speech
    brief: >-
      Speech that is true, kind, useful and timely; refraining from gossip, harsh words
      and idle chatter. The practitioner struggles in group chats and meetings.
  - id: five-precepts
    label: The five precepts
    brief: >-
      The lay training rules: not killing, not stealing, no sexual misconduct, no false
      speech, no intoxicants. Small everyday tests, such as the mosquito in the room.
  - id: three-trainings
    label: Sila, samadhi, panna
    brief: >-
      The threefold training that sums up the eightfold path: virtue, concentration and
      wisdom, each resting on the one before. The practitioner wants the wisdom, reads
      about it at length, and skips the precepts and the sitting it depends on.
  - id: five-aggregates
    label: The five aggregates
    brief: >-
      The khandhas: form, feeling, perception, mental formations, consciousness; none of
      them is "me" or "mine". The practitioner recites "this mood is not me" while being
      entirely the mood.

  # --- meditation and the mind ---
  - id: monkey-mind
    label: Monkey mind
    brief: >-
      The restless mind that jumps from thought to thought, especially the moment one
      sits down to meditate.
  - id: mindfulness
    label: Mindfulness
    brief: >-
      Sati: present-moment awareness in daily life, and how quickly it is lost to
      autopilot, phones and snacks.
  - id: meditation
    label: Meditation
    brief: >-
      Sitting practice: numb legs, sleepiness, planning lunch, watching the clock,
      wondering whether the timer started.
  - id: retreat
    label: Retreat life
    brief: >-
      Silent retreats: noble silence, early bells, simple food, other people's small
      noises, and coming home to a full inbox.
  - id: five-hindrances
    label: The five hindrances
    brief: >-
      Sense desire, ill will, sloth and torpor, restlessness and worry, and doubt: what
      gets in the way of a settled mind. In one sitting the practitioner meets all five,
      usually sleepiness first and doubt about the whole method last.

  # --- the heart ---
  - id: loving-kindness
    label: Loving-kindness
    brief: >-
      Metta: wishing all beings well. Easy for friends and strangers, hard for the one
      difficult person and for drivers in traffic.
  - id: compassion
    label: Compassion
    brief: >-
      Karuna: caring about others' suffering and acting on it. The practitioner feels it
      for all sentient beings and still snaps at a family member.
  - id: generosity
    label: Generosity
    brief: >-
      Dana: giving freely. The practitioner's inner accountant, and the wish to be seen
      being generous.
  - id: relinquishment
    label: Relinquishment
    brief: >-
      Caga: the open-handed heart that gives things up gladly. Giving away what one no
      longer wanted is easy; the practitioner is tested by the thing they still like,
      the last slice, the good seat, the favourite mug.
  - id: patience
    label: Patience
    brief: >-
      Kshanti: forbearance under provocation. Queues, slow wifi, relatives.

  # --- Mahayana, Chan and Pure Land ---
  - id: emptiness
    label: Emptiness
    brief: >-
      Sunyata: things have no fixed, independent nature. The practitioner nods at "form
      is emptiness" from the Heart Sutra and still treats their problems as solid.
  - id: bodhisattva-vow
    label: The bodhisattva vow
    brief: >-
      Vowing to work for the liberation of all sentient beings, however countless. The
      practitioner makes the vast vow and then can't be bothered with one small favour.
  - id: buddha-nature
    label: Buddha-nature
    brief: >-
      Every being already has the capacity to awaken. The practitioner believes it of
      everyone except themselves on a bad day, or except the person who annoyed them.
  - id: chan
    label: Chan and Zen
    brief: >-
      Koans, "just sitting", beginner's mind, chopping wood and carrying water. The
      practitioner overthinks the instruction not to overthink.
  - id: pure-land
    label: Pure Land practice
    brief: >-
      Reciting the Buddha's name (nianfo), faith, vows and practice. The joke is on the
      practitioner's wandering mind and lost count of recitations, never on Amitabha
      or the Pure Land itself.
  - id: vegetarian
    label: Vegetarian life
    brief: >-
      Vegetarianism out of compassion, common in Chinese Mahayana: temple meals, mock
      meat, well-meaning relatives, reading every ingredient label.
  - id: merit
    label: Merit
    brief: >-
      Making and dedicating merit: chanting, offerings, volunteering at the temple. The
      practitioner quietly keeps score, which rather misses the point.

  # --- festivals: offered only from two weeks before to a few days after their dates.
  # `lunar` holds Chinese lunar-calendar MM-DD dates; the build works out the real dates.
  - id: vesak
    label: Vesak
    lunar: ["04-15"]
    brief: >-
      Vesak Day, marking the Buddha's birth, awakening and passing: bathing the Buddha,
      temple queues, lanterns, vegetarian meals. The practitioner resolves to keep the
      precepts all day and is tested by the crowd, the queue and the heat. The joke is on
      the practitioner, never on the Buddha or the rites.
  - id: ullambana
    label: Ullambana
    lunar: ["07-15"]
    brief: >-
      The Ullambana festival in the seventh lunar month: dedicating merit to parents and
      ancestors out of filial piety, chanting for beings in the lower realms. The
      practitioner dedicates merit to parents of countless lifetimes and is impatient
      with the two at home. Never mock offerings, ancestors or anyone's beliefs.
  - id: bodhi-day
    label: Bodhi Day
    lunar: ["12-08"]
    brief: >-
      The day the Buddha awakened under the Bodhi tree, marked in Chinese temples with
      Laba congee. The practitioner sits up late hoping for insight and mostly finds
      sleepiness, or queues for the congee more keenly than for the meditation.
  - id: lunar-new-year
    label: Lunar New Year
    lunar: ["01-01"]
    brief: >-
      New Year at the temple: first-day prayers, a vegetarian first day, lamps lit for the
      year ahead, then the reunion dinner. The practitioner vows equanimity for the new
      year and meets the relatives' questions about salary and marriage.
  - id: guanyin-day
    label: Guanyin's day
    lunar: ["02-19", "06-19", "09-19"]
    brief: >-
      One of the three days honouring Guanyin, the bodhisattva of compassion, with
      chanting and vegetarian meals. The practitioner chants for great compassion and has
      none left for the person cutting the queue. The joke is on the practitioner, never
      on Guanyin.
  - id: amitabha-day
    label: Amitabha's birthday
    lunar: ["11-17"]
    brief: >-
      Amitabha Buddha's day in Pure Land temples, with long sessions reciting his name.
      The joke is on the practitioner's wandering mind and lost count, never on Amitabha
      or the Pure Land.
