# 中文主題（/chinesememe）。不是英文主題的翻譯：這裡是漢傳佛教、人間佛教的語境，
# 用台灣常見的說法。`label` 是按鈕上的字；`brief` 只給模型看。
# 笑點永遠落在修行人自己身上，不取笑佛菩薩、法師、經典或任何宗教。

themes:
  - id: wuchang
    label: 無常
    brief: 道理都懂：一切都會變。可是手機摔了、店收了、計畫變了，還是照樣崩潰。
  - id: fangxia
    label: 放下
    brief: 嘴上說放下了，轉頭又撿回來：舊帳、前任、沒吵贏的那一架、購物車。
  - id: suiyuan
    label: 隨緣
    brief: 把「隨緣」當成不努力、不回訊息、不做決定的藉口；真的要隨緣時又放不開。
  - id: zhizhuo
    label: 執著
    brief: 對手機、面子、對錯、飲料、別人的看法的執著；連「我不執著」也很執著。
  - id: yinguo
    label: 因果
    brief: 自己種的因，自己收的果，卻一臉驚訝：熬夜、拖延、亂說話、亂買東西。
  - id: cibei
    label: 慈悲
    brief: 願眾生離苦得樂，但是對家人、同事、馬路上的駕駛沒有耐心。
  - id: nianfo
    label: 念佛
    brief: 念佛時妄念紛飛、數到忘記、邊念邊想晚餐。笑點在自己散亂的心，絕不取笑佛號、阿彌陀佛或淨土。
  - id: dazuo
    label: 打坐
    brief: 腿麻、昏沉、偷看時間、想東想西、聽到引磬終於解脫的那一刻。
  - id: chisu
    label: 吃素
    brief: 素食生活：看成分表、素料、親友的關心、聚餐只能吃燙青菜、聞到鹹酥雞的考驗。
  - id: gongde
    label: 功德
    brief: 做功德卻在心裡記帳、想被看見、算回報，剛好忘了「無相布施」。
  - id: faxin
    label: 發心
    brief: 發了大願要度眾生、要精進，三天後連早起都做不到；發心容易，恆心難。
  - id: gongxiu
    label: 共修與法會
    brief: 共修、法會、朝山：跪到腿軟、唱誦跟不上、找不到經本第幾頁、搶位子。
  - id: zhigong
    label: 做義工
    brief: 在道場當義工：香積組、知客、行堂。一邊發心服務，一邊起煩惱、比較誰做得多。
  - id: sanhao
    label: 三好
    brief: 做好事、說好話、存好心。理想很美，一塞車、一開會、一看群組就破功。
  - id: renru
    label: 忍辱
    brief: 修忍辱：排隊、網路慢、被插嘴、親戚的問候。表面微笑，內心翻騰。
  - id: kouye
    label: 口業
    brief: 剛聽完「不說是非」的開示，一出門就忍不住八卦、抱怨、酸人。
  - id: chan
    label: 禪
    brief: 參話頭、「吃飯時吃飯」、平常心是道。越叫自己不要想，想得越多。
  - id: foxi
    label: 佛系
    brief: 網路上的「佛系」是都可以、沒關係、不強求；真正的修行其實很精進。兩者之間的落差。
  - id: fannao
    label: 煩惱
    brief: 煩惱即菩提，但現在只有煩惱：工作、帳單、已讀不回、小孩的功課。
  - id: zaoke
    label: 早課
    brief: 下定決心早起做早課，鬧鐘響了以後的內心交戰。
